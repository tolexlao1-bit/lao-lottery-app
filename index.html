<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandel-Selbee Engine - Optimized Numbers</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // ⚙️ ກະລຸນາປ່ຽນຄ່າເຫຼົ່ານີ້ໃຫ້ເປັນຂໍ້ມູນ Firebase Project ຂອງທ່ານຕົວຈິງ
        const firebaseConfig = {
            apiKey: "AIzaSyC0qZf7frh9BYjtb6iZnWjfMjMnhucfAhI",
            authDomain: "lao-lottery-engine.firebaseapp.com",
            databaseURL: "https://lao-lottery-engine-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lao-lottery-engine",
            storageBucket: "lao-lottery-engine.firebasestorage.app",
            messagingSenderId: "780776961991",
            appId: "1:780776961991:web:480fef483ee174377e4be2",
            measurementId: "G-3C8CT0YFYF"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // -------------------------------------------------------------
        // 🧮 Logic: ຟັງຊັນສ້າງຕົວເລກໃຫ້ໄດ້ຄ່າ Delta ຕາມທີ່ກຳນົດ
        // -------------------------------------------------------------
        function generateNumbersForDelta(targetDelta) {
            let attempts = 0;
            while (attempts < 1000) {
                let nums = Array.from({length: 6}, () => Math.floor(Math.random() * 10));
                let totalDiff = 0;
                for (let i = 0; i < 5; i++) {
                    totalDiff += Math.abs(nums[i+1] - nums[i]);
                }
                let calcDelta = totalDiff / 5;
                
                // ອະນຸຍາດໃຫ້ມີຄ່າຄາດເຄື່ອນໄດ້ເລັກນ້ອຍ ±0.2
                if (Math.abs(calcDelta - targetDelta) <= 0.2) {
                    return nums;
                }
                attempts++;
            }
            return [7, 4, 1, 4, 6, 9]; // ຕົວເລກ Base ຖ້າຄຳນວນບໍ່ທັນ
        }

        // -------------------------------------------------------------
        // 🚀 Main Process: ຟັງຊັນຫຼັກໃນການຈັດການຕົວເລກ
        // -------------------------------------------------------------
        async function handleOptimize() {
            const deltaInput = parseFloat(document.getElementById('delta-input').value);
            const resultDisplay = document.getElementById('result-display');
            const statusDisplay = document.getElementById('status-message');

            if (isNaN(deltaInput)) {
                alert("ກະລຸນາປ້ອນຄ່າ Delta ກ່ອນ!");
                return;
            }

            // ສົມມຸດ ID ຂອງຜູ້ໃຊ້ (ໃນລະບົບຈິງສາມາດປ່ຽນເປັນ User ID ຈາກ Firebase Auth ໄດ້)
            const userId = "current_user_session"; 
            const dbRef = ref(db);

            try {
                // 🔍 1. ກວດສອບຂໍ້ມູນຫຼ້າສຸດທີ່ເຄີຍບັນທຶກໄວ້ໃນ Firebase
                const snapshot = await get(child(dbRef, `users/${userId}`));
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    
                    // 🕵️‍♂️ ຖ້າຄ່າ Delta ໃໝ່ທີ່ປ້ອນ ເທົ່າກັບຄ່າ Delta ທີ່ເຄີຍຄຳນວນໄວ້ແລ້ວ
                    if (userData.current_delta === deltaInput && userData.locked_numbers) {
                        // ສະແດງເລກຊຸດເດີມ ບໍ່ປ່ຽນແປງ
                        displayNumbers(userData.locked_numbers);
                        statusDisplay.innerText = "🔒 ໃຊ້ຕົວເລກຊຸດເດີມ (ຄ່າ Delta ບໍ່ປ່ຽນແປງ)";
                        statusDisplay.style.color = "#ff9800";
                        return; // ຈົບການເຮັດວຽກທັນທີ
                    }
                }

                // 🔄 2. ຖ້າເປັນຄ່າ Delta ໃໝ່ ຫຼື ຍັງບໍ່ເຄີຍມີຂໍ້ມູນ, ໃຫ້ຄຳນວນໃໝ່
                statusDisplay.innerText = "⚡ ກຳລັງຄຳນວນຕົວເລກໃໝ່...";
                statusDisplay.style.color = "#4caf50";
                
                const newNumbers = generateNumbersForDelta(deltaInput);

                // 💾 3. ບັນທຶກຄ່າ Delta ໃໝ່ ແລະ ເລກຊຸດໃໝ່ລົງ Firebase ເພື່ອລັອກໄວ້
                await set(ref(db, `users/${userId}`), {
                    current_delta: deltaInput,
                    locked_numbers: newNumbers,
                    updated_at: new Date().toISOString()
                });

                // ສະແດງຜົນເລກໃໝ່
                displayNumbers(newNumbers);
                statusDisplay.innerText = "🎯 ສ້າງຕົວເລກໃໝ່ ແລະ ລັອກຄ່າຮຽບຮ້ອຍແລ້ວ!";
                statusDisplay.style.color = "#4caf50";

            } catch (error) {
                console.error("Firebase Error:", error);
                statusDisplay.innerText = "❌ ເກີດຂໍ້ຜິດພາດໃນການເຊື່ອມຕໍ່ລະບົບ.";
                statusDisplay.style.color = "#f44336";
            }
        }

        // ຟັງຊັນຊ່ວຍໃນການສະແດງຜົນຕົວເລກເທິງໜ້າຈໍ
        function displayNumbers(numArray) {
            const container = document.getElementById('result-display');
            container.innerHTML = ''; // ລ້າງຄ່າເກົ່າ
            
            numArray.forEach(num => {
                const ball = document.createElement('div');
                ball.className = 'number-ball';
                ball.innerText = num;
                container.appendChild(ball);
            });
        }

        // ຜູກມັດຟັງຊັນເຂົ້າກັບປຸ່ມກົດເມື່ອໂຫຼດໜ້າເວັບຮຽບຮ້ອຍ
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-generate').addEventListener('click', handleOptimize);
        });
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #162447;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #e43f5a;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #bfa3ff;
        }
        input[type="number"] {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #1f4068;
            background-color: #1a1a2e;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #e43f5a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 85%;
        }
        button:hover {
            background-color: #ff4b6b;
        }
        .result-container {
            margin-top: 30px;
            min-height: 80px;
        }
        #result-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .number-ball {
            background: linear-gradient(145deg, #e43f5a, #b32e44);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #status-message {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mandel-Selbee Engine</h2>
    <p style="font-size: 12px; color: #8892b0;">ຄິດໄລ່ ແລະ ຈັດຊຸດຕົວເລກທີ່ເໝາະສົມທີ່ສຸດ</p>
    
    <div class="input-group">
        <label for="delta-input">ປ້ອນຄ່າ Harvey Cover Delta (Δ):</label>
        <input type="number" id="delta-input" step="0.01" value="3.00" placeholder="ຕົວຢ່າງ: 3.00">
    </div>

    <button id="btn-generate">ສ້າງໂຕເລກທີ່ເໝາະສົມທີ່ສຸດ</button>

    <div class="result-container">
        <div id="result-display">
            </div>
        <div id="status-message"></div>
    </div>
</div>

</body>
</html>
