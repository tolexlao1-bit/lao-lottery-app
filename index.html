<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandel-Selbee Engine - Optimized Numbers</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // 🔐 ຂໍ້ມູນບ່ອນເຊື່ອມຕໍ່ Firebase ຂອງທ່ານ (ກະລຸນາເກັບຮັກສາຄ່າຕົວຈິງຂອງທ່ານໄວ້ບ່ອນນີ້)
const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // ເລີ່ມຕົ້ນລະບົບ Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // -------------------------------------------------------------
        // 🧮 Logic: ຟັງຊັນສ້າງຕົວເລກໃຫ້ໄດ້ຄ່າ Delta ຕາມທີ່ກຳນົດ
        // -------------------------------------------------------------
        function generateNumbersForDelta(targetDelta) {
            let attempts = 0;
            while (attempts < 1000) {
                // ສ້າງເລກສຸ່ມ 6 ຕົວ (0-9)
                let nums = Array.from({length: 6}, () => Math.floor(Math.random() * 10));
                let totalDiff = 0;
                for (let i = 0; i < 5; i++) {
                    totalDiff += Math.abs(nums[i+1] - nums[i]);
                }
                let calcDelta = totalDiff / 5;
                
                // ເງື່ອນໄຂຄ່າຄາດເຄື່ອນ Delta ທີ່ຍອມຮັບໄດ້ (±0.2)
                if (Math.abs(calcDelta - targetDelta) <= 0.2) {
                    return nums;
                }
                attempts++;
            }
            return [7, 4, 1, 4, 6, 9]; // ຕົວເລກ Default ຫາກຄຳນວນເກີນກຳນົດ
        }

        // -------------------------------------------------------------
        // 🚀 Main Process: ຟັງຊັນຫຼັກໃນການຈັດການຕົວເລກ ແລະ ບັນທຶກລົງ Firebase
        // -------------------------------------------------------------
        async function handleOptimize() {
            const deltaInput = parseFloat(document.getElementById('delta-input').value);
            const statusDisplay = document.getElementById('status-message');

            if (isNaN(deltaInput)) {
                alert("ກະລຸນາປ້ອນຄ່າ Delta ກ່ອນ!");
                return;
            }

            // ID ຂອງ Session ຜູ້ໃຊ້ (ສາມາດປ່ຽນເປັນ User ID ຈາກລະບົບ Auth ຂອງທ່ານໄດ້)
            const userId = "current_user_session"; 
            const dbRef = ref(db);

            try {
                // 🔍 1. ດຶງຂໍ້ມູນຫຼ້າສຸດທີ່ເຄີຍບັນທຶກໄວ້ໃນ Firebase ມາສະແກນກ່ອນ
                const snapshot = await get(child(dbRef, `users/${userId}`));
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    
                    // 🕵️‍♂️ ກວດສອບ: ຖ້າຄ່າ Delta ໃໝ່ທີ່ປ້ອນ ເທົ່າກັບຄ່າ Delta ທີ່ຢູ່ໃນຖານຂໍ້ມູນແລ້ວ
                    if (userData.current_delta === deltaInput && userData.locked_numbers) {
                        // ສະແດງເລກຊຸດເດີມທັນທີ ໂດຍບໍ່ມີການປ່ຽນແປງຄ່າ
                        displayNumbers(userData.locked_numbers);
                        statusDisplay.innerText = "🔒 ໃຊ້ຕົວເລກຊຸດເດີມ (ຄ່າ Delta ບໍ່ປ່ຽນແປງ)";
                        statusDisplay.style.color = "#ff9800";
                        return; // ຢຸດການເຮັດວຽກທັນທີ ບໍ່ Re-random
                    }
                }

                // 🔄 2. ຖ້າເປັນຄ່າ Delta ໃໝ່ ໃຫ້ລະບົບຄຳນວນຊຸດຕົວເລກໃໝ່
                statusDisplay.innerText = "⚡ ກຳລັງຄຳນວນຕົວເລກໃໝ່...";
                statusDisplay.style.color = "#4caf50";
                
                const newNumbers = generateNumbersForDelta(deltaInput);

                // 💾 3. ຂຽນຄ່າ Delta ແລະ ເລກຊຸດໃໝ່ລົງ Firebase ເພື່ອລັອກຄ່າໄວ້
                await set(ref(db, `users/${userId}`), {
                    current_delta: deltaInput,
                    locked_numbers: newNumbers,
                    updated_at: new Date().toISOString()
                });

                // ສະແດງຜົນເລກຊຸດໃໝ່ອອກໜ້າຈໍ
                displayNumbers(newNumbers);
                statusDisplay.innerText = "🎯 ສ້າງຕົວເລກໃໝ່ ແລະ ລັອກຄ່າຮຽບຮ້ອຍແລ້ວ!";
                statusDisplay.style.color = "#4caf50";

            } catch (error) {
                console.error("Firebase Error:", error);
                statusDisplay.innerText = "❌ ເກີດຂໍ້ຜິດພາດໃນການເຊື່ອມຕໍ່ Firebase.";
                statusDisplay.style.color = "#f44336";
            }
        }

        // 🎨 ຟັງຊັນຈັດການ Render ຕົວເລກໃຫ້ສະແດງເທິງໜ້າຈໍ
        function displayNumbers(numArray) {
            const container = document.getElementById('result-display');
            container.innerHTML = ''; // ລ້າງຕົວເລກເກົ່າອອກ
            
            numArray.forEach(num => {
                const ball = document.createElement('div');
                ball.className = 'number-ball';
                ball.innerText = num;
                container.appendChild(ball);
            });
        }

        // 🔌 ຜູກມັດ Event ເມື່ອມີການກົດປຸ່ມ ສ້າງໂຕເລກ
        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('btn-generate');
            if(btn) {
                btn.addEventListener('click', handleOptimize);
            }
        });
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #162447;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #e43f5a;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #bfa3ff;
        }
        input[type="number"] {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #1f4068;
            background-color: #1a1a2e;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #e43f5a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 85%;
        }
        button:hover {
            background-color: #ff4b6b;
        }
        .result-container {
            margin-top: 30px;
            min-height: 80px;
        }
        #result-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .number-ball {
            background: linear-gradient(145deg, #e43f5a, #b32e44);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #status-message {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mandel-Selbee Engine</h2>
    <p style="font-size: 12px; color: #8892b0;">ຄິດໄລ່ ແລະ ຈັດຊຸດຕົວເລກທີ່ເໝາະສົມທີ່ສຸດ</p>
    
    <div class="input-group">
        <label for="delta-input">ປ້ອນຄ່າ Harvey Cover Delta (Δ):</label>
        <input type="number" id="delta-input" step="0.01" value="3.00" placeholder="ຕົວຢ່າງ: 3.00">
    </div>

    <button id="btn-generate">ສ້າງໂຕເລກທີ່ເໝາະສົມທີ່ສຸດ</button>

    <div class="result-container">
        <div id="result-display">
            </div>
        <div id="status-message"></div>
    </div>
</div>

</body>
</html>
